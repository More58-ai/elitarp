<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELITE RP — Заставка</title>
  
  <!-- Подключение шрифтов Unbounded и Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0c10;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Manrope', sans-serif;
      overflow: hidden;
      color: #ffffff;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* Золотисто-бурштинове фонове сяйво */
    .bg-glow {
      position: absolute;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, rgba(251, 191, 36, 0.03) 45%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
    }

    /* Основна картка зі склоподібним ефектом (Glassmorphism) */
    .splash-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 48px 36px;
      background: rgba(18, 20, 26, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7),
                  0 0 40px rgba(245, 158, 11, 0.05);
      max-width: 480px;
      width: 90%;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    /* Кнопка живлення у золотому стилі */
    .power-button {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.08);
      border: 2px solid rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.15);
      margin-bottom: 28px;
      outline: none;
    }

    .power-button svg {
      width: 34px;
      height: 34px;
      stroke: #f59e0b;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.8));
    }

    .power-button:hover {
      background: rgba(245, 158, 11, 0.2);
      border-color: #fbbf24;
      transform: scale(1.08);
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.4);
    }

    .power-button:active {
      transform: scale(0.92);
    }

    /* Заголовок із золотим градієнтом */
    .title {
      font-family: 'Unbounded', sans-serif;
      font-size: 2.6rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 12px;
      line-height: 1.1;
    }

    .gold-text {
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(246, 211, 101, 0.3));
    }

    /* Підзаголовок */
    .subtitle {
      font-size: 0.95rem;
      color: #9ca3af;
      font-weight: 500;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Бейдж сервера */
    .server-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #e5e7eb;
      text-transform: uppercase;
    }

    /* Пульсуюча точка статусу */
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #f59e0b;
      border-radius: 50%;
      box-shadow: 0 0 10px #f59e0b;
      animation: pulse 2s infinite;
    }

    /* Футер */
    .footer-text {
      position: absolute;
      bottom: 24px;
      font-size: 0.85rem;
      color: #6b7280;
      letter-spacing: 0.5px;
      z-index: 2;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 8px rgba(245, 158, 11, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
      }
    }
  </style>
</head>
<body>

  <!-- М'яке сяйво на фоні -->
  <div class="bg-glow"></div>

  <!-- Головна картка -->
  <div class="splash-container" id="cardContainer">
    
    <!-- Кнопка живлення -->
    <button class="power-button" id="powerBtn" aria-label="Увійти на портал">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
        <line x1="12" y1="2" x2="12" y2="12"></line>
      </svg>
    </button>

    <!-- Назва бренду -->
    <h1 class="title"><span class="gold-text">ELITE</span> RP</h1>

    <!-- Підзаголовок -->
    <p class="subtitle">Натисніть кнопку вище для переходу на портал</p>

    <!-- Плашка статусу сервера -->
    <div class="server-badge">
      <span class="status-dot"></span>
      ELITE PORTAL ONLINE
    </div>

  </div>

  <!-- Текст у самому низу -->
  <div class="footer-text">Дякуємо за терпіння</div>

  <script>
    const powerBtn = document.getElementById('powerBtn');
    const cardContainer = document.getElementById('cardContainer');

    // Обробник кліку для переходу за посиланням
    powerBtn.addEventListener('click', function() {
      // Додаємо легку анімацію зникнення при натисканні
      cardContainer.style.transform = 'scale(0.95)';
      cardContainer.style.opacity = '0.5';

      setTimeout(() => {
        window.location.href = 'https://rolegame-portal.lovable.app/';
      }, 200);
    });
  </script>

</body>
</html>
