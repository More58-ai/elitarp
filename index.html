<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Mini App</title>
  <!-- Обов'язковий скрипт Telegram SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1 id="user-name">Привіт!</h1>
  <button id="main-btn">Надіслати дані в бот</button>

  <script>
    // Ініціалізація Telegram Web App
    const tg = window.Telegram.WebApp;
    tg.expand(); // Розгортаємо додаток на весь екран

    // Отримання даних користувача з Telegram
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('user-name').innerText = `Привіт, ${tg.initDataUnsafe.user.first_name}!`;
    }

    // Подія при натисканні на кнопку
    document.getElementById('main-btn').addEventListener('click', () => {
      tg.sendData("Дані з Mini App"); // Надсилає дані назад у бот
    });
  </script>
</body>
</html>
